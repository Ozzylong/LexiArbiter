name: Release macOS

# push tag v* (例如 v1.0.0) 時觸發；建議流程：
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # Actions 分頁手動觸發，不用打 tag 也能測打包流程

# release 上傳 asset 需要 contents: write 權限
permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS .app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 一個架構失敗不要中斷另一個
      matrix:
        include:
          - runner: macos-latest     # arm64 (Apple Silicon)
            arch: arm64
          - runner: macos-15-intel   # x86_64 (Intel)，GitHub 提供至 2027/08
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns from .png
        # macOS 內建工具 sips + iconutil，把 LexiArbiter_icon.png 轉成 .icns。
        # 各尺寸都產生，讓 Finder / Dock / 切換器都有對應解析度。
        run: |
          mkdir -p assets/LexiArbiter_icon.iconset
          ICONSET=assets/LexiArbiter_icon.iconset
          SRC=assets/LexiArbiter_icon.png
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o assets/LexiArbiter_icon.icns
          # iconset 只是轉檔用的中繼資料夾，留在 assets/ 會被 build_mac.py 一併
          # 複製進 .app，最後讓 codesign --deep 誤判成 bundle 而失敗。轉完即刪。
          rm -rf "$ICONSET"

      - name: Build .app bundle
        run: python build_mac.py

      - name: Verify codesign
        run: codesign --verify --verbose dist/LexiArbiter.app

      - name: Upload build artifact
        # 兩個架構的 zip 先各自上傳成 artifact，release job 再一次收齊發版，
        # 避免平行 job 同時呼叫 action-gh-release 產生重複的草稿 release。
        uses: actions/upload-artifact@v4
        with:
          name: LexiArbiter-macos-${{ matrix.arch }}
          path: dist/LexiArbiter-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')   # 手動觸發(無tag)時跳過，不報錯
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # 兩個 artifact 的 zip 攤平到同一層 dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LexiArbiter-macos-*.zip
          draft: true                              # 先發草稿，驗過再手動 Publish
          generate_release_notes: true
